dataset:
  name: TU_Berlin
  modality: EEG
  path: data/preprocessed/eeg

evaluation:
  strategy: leave_one_subject_out
  random_state: 42
  inner_splits: 2
  max_training_epochs_per_subject: 30

features:
  sampling_frequency_hz: 200
  bands:
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
  welch_nperseg: 256

models:
  svm:
    class_weight: balanced
    grid:
      C: [10.0]
      gamma: [scale]
  random_forest:
    n_estimators: 200
    max_depth: [null, 20]
    class_weight: balanced

runtime:
  seed: 42
  results_dir: results/eeg_baseline
